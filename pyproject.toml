[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweepforge"
version = "0.1.0"
description = "Fit one-motor motion, inspect entire-cycle clearances, and export replayable linkage designs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2.3.5,<3", "scipy>=1.18.1,<2", "mpmath==1.3.0"]
keywords = ["mechanisms", "kinematics", "interval-arithmetic", "motion-design", "four-bar"]

[project.urls]
Repository = "https://github.com/nazeeh111/Sweepforge"
Issues = "https://github.com/nazeeh111/Sweepforge/issues"

[project.scripts]
sweepforge = "sweepforge.cli:main"

[tool.setuptools]
packages = ["sweepforge"]
include-package-data = true

[tool.setuptools.package-data]
sweepforge = ["assets/*"]
